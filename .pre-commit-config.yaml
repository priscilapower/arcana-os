repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Golden files and recorded fixtures pin bytes exactly, trailing spaces included.
      - id: trailing-whitespace
        exclude: ^packages/arcana-cli/tests/.*/(golden|fixtures)/
      - id: end-of-file-fixer
        exclude: ^packages/arcana-cli/tests/.*/(golden|fixtures)/
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: no-commit-to-branch
        args: [ "--branch", "main" ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run --frozen pyright
        language: system
        types: [python]
        pass_filenames: true
