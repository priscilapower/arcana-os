name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Guard against a hung test/shutdown holding the runner for the 6h default.
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type check - arcana-core
        run: uv run pyright packages/arcana-core/arcana

      - name: Type check - arcana-cli
        run: uv run pyright packages/arcana-cli/arcana_cli

      # Fast default tier: fully mocked and deterministic — no real process,
      # network, or MCP server. The `slow` sandbox tests run in their own job.
      - name: Unit tests — arcana-core (fast tier)
        run: uv run pytest packages/arcana-core/tests/ -v -m "not llm_eval and not slow"

      - name: Unit tests — arcana-cli (fast tier)
        run: uv run pytest packages/arcana-cli/tests/ -v -m "not llm_eval and not slow"

      # The security catalog + guard-has-test presence check as its own gate, so
      # a new tool that ships without an adversarial test can't merge.
      - name: Security regression gate
        run: uv run pytest packages/arcana-core/tests/tools/security/ -v -m security

      # Line floor on the tool surface (tools/** + guardrails.py), measured over
      # the whole tool suite including the slow sandbox tier.
      - name: Tool coverage floor
        run: >-
          uv run pytest packages/arcana-core/tests/tools/ packages/arcana-core/tests/agents/
          -m "not llm_eval" -o addopts=""
          --cov=arcana.tools --cov-report=term-missing --cov-fail-under=90

  sandbox:
    name: Slow tier — real sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      # The one tier that spawns real subprocess sandboxes. Backend-specific tests
      # (bwrap/container) self-skip with a loud reason when the binary is absent.
      - name: Slow sandbox tests
        run: uv run pytest packages/arcana-core/tests/ -v -m "slow"

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Build site (strict)
        run: uv run --group docs mkdocs build --strict

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify every commit is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git rev-list --no-merges "$base".."$head"); do
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $sha is missing a 'Signed-off-by' line (DCO)."
              git show -s --format='  %h %s' "$sha"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "All commits must be signed off. Use 'git commit -s', or sign off existing commits with 'git rebase --signoff $base'."
            exit 1
          fi
          echo "All commits are signed off. ✅"
